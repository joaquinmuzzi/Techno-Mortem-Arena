[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation platform("org.junit:junit-bom:6.1.3")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// JUnit 6 exige Java 17, pero el juego se sigue compilando para Java 8: solo los tests suben de
// target. El CI ya compila con JDK 17, asi que esto no cambia lo que se distribuye.
compileTestJava.options.release = 17

test {
  useJUnitPlatform()
  testLogging {
    events 'failed'
    exceptionFormat 'full'
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
